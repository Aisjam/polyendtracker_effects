name: Extract Audio.zip into Effects

on:
  push:
    paths:
      - '.github/workflows/extract-audio-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract archive safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path("Effects").resolve()
          archive = root / "Audio.zip"
          with zipfile.ZipFile(archive) as zf:
              files = [entry for entry in zf.infolist() if not entry.is_dir()]
              if len(files) > 10000:
                  raise RuntimeError("Too many files in archive")
              total = sum(entry.file_size for entry in files)
              if total > 500 * 1024 * 1024:
                  raise RuntimeError("Archive would extract more than 500 MB")
              for entry in files:
                  dest = (root / entry.filename).resolve()
                  if not dest.is_relative_to(root):
                      raise RuntimeError(f"Unsafe archive path: {entry.filename}")
                  if dest.exists():
                      raise RuntimeError(f"Existing file would be overwritten: {dest}")
              for entry in files:
                  dest = (root / entry.filename).resolve()
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(entry) as src, dest.open("wb") as dst:
                      import shutil
                      shutil.copyfileobj(src, dst)
              print(f"Extracted {len(files)} files ({total} bytes) into Effects/")
          PY
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Effects/
          if ! git diff --cached --quiet; then
            git commit -m "Extract Effects/Audio.zip"
            git push
          fi
